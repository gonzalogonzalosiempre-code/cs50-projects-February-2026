<!DOCTYPE html>

<html>
    <head lang="es">
        <title>
            Hello World
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
        <body>
            <h1 class="header">
                <span style="color: white; font-size: 55px; font-family: Montserrat, sans-serif;">
                    Trivia!
                </span>
            </h1>
            <div>
                  <ul>
                    <h2>
                        Part1: Multiple Choice
                    </h2>
                    <hr>
                    <p style="font-size: large;">
                        <strong>Whats is the approximate ratio of people to sheep in New ZeaLand</strong>
                    </p>
                    <p class="content">
                      <button> 6 poeple per 1 sheep</button>
                      <button> 1 person per 6 sheep</button>
                      <button> 1 person per 1 sheep</button>
                      <button> 1 person per 3 sheep</button>
                      <button> 1 persona per 6 sheep</button>
                      </p>
                    </ul>
            </div>
            <div>
                <ul>
                    <h2>
                        Part 2: Free Response
                    </h2>
                     <hr>
                     <h3 style="font-size: large;">
                        <strong> In which country is it illegal to own only one guinea pig, as a lone guinea pig might get lonely</strong>
                     </h3>
                     <input type="search" style = "padding: 5px;">
                     <input class="button" type="submit" onclick="CheckResponde(event)"value="Check Answer;">
                </ul>
            </div>
            <script>
                function Incorrect(buttons) {
    buttons.forEach(button => {
        button.style.backgroundColor = "#FF0000";
        button.textContent = "Incorrect";
    });
}

function Correct(buttons) {
        buttons.forEach(button => {
        button.style.backgroundColor = "#00FF00";
        button.textContent = "Correct";
    });
}

let BotonCorrecto = document.querySelectorAll('button')[1];

BotonCorrecto.addEventListener('click', function() {
    Correct([BotonCorrecto]);
});

let BotonesIncorrectos = document.querySelectorAll('button:not(:nth-child(2))');
BotonesIncorrectos.forEach(button => {
    button.addEventListener('click', function() {
        Incorrect([button]);
    });
});

function CheckResponde(event)
{

let Text = document.querySelector('h3');

let respuesta = document.querySelector('input[type="search"]');

let input = document.querySelector('input[type="submit"]');

input.addEventListener('click', function() {
    input.style.backgroundColor = "#044ea1";
    if (respuesta.value.toLowerCase() === 'switzerland')
    {
        Text.style.color = "green";
        Text.textContent = "Correct";
    }
    else {
        Text.textContent = "Incorrect";
        Text.style.color = "red";
    }
});

}

            </script>
        </body>
</html>
